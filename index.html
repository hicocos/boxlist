<!doctype html>
<html lang="en" translate="no">
  <head>
    <!-- customize head -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="generator" content="OpenList" />
    <meta name="theme-color" content="#000000" />
    <meta name="google" content="notranslate" />
    <link href="/manifest.json" rel="manifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenList" />
    <link rel="apple-touch-icon" href="https://res.oplist.org/logo/logo.png" />
    <link
      rel="shortcut icon"
      type="image/ico"
      href="https://res.oplist.org/logo/logo.svg"
    />
    <title>Loading...</title>
    <script>
      window.OPENLIST_CONFIG = {
        cdn: undefined,
        base_path: undefined,
        api: undefined,
        main_color: undefined,
      }
      window.__dynamic_base__ = window.OPENLIST_CONFIG.cdn || ""
      document.documentElement.style.setProperty("--startup-accent", window.OPENLIST_CONFIG.main_color || "#1890ff")
    </script>
    <style>
      #startup-loading{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}#startup-loading span{box-sizing:border-box;width:48px;height:48px;border:4px solid #e9ecef;border-top-color:var(--startup-accent,#1890ff);border-left-color:var(--startup-accent,#1890ff);border-radius:50%;animation:startup-spin .65s linear infinite}@keyframes startup-spin{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){#startup-loading span{border-right-color:#2b3033;border-bottom-color:#2b3033}}@media(prefers-reduced-motion:reduce){#startup-loading span{animation-duration:1.5s}}
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="startup-loading" role="status" aria-label="正在加载"><span aria-hidden="true"></span></div>
    <div id="root"></div>

    <script src="/src/main.tsx" type="module"></script>
    <template id="deferred-customize-body"><!-- customize body --></template>
    <script src="/static/startup.js" defer></script>
  </body>
</html>
