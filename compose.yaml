name: boxlist
services:
  boxlist:
    image: boxlist:local
    build:
      context: .
      args:
        VERSION: v1.0
    restart: unless-stopped
    environment:
      SITE_URL: "${SITE_URL:-}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-5244}:5244"
    volumes:
      - data:/opt/openlist/data
    stop_grace_period: 30s
volumes:
  data:
