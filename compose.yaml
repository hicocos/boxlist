name: boxlist
services:
  boxlist:
    container_name: "${BOXLIST_CONTAINER_NAME:-boxlist}"
    image: "${BOXLIST_IMAGE:-ghcr.io/hicocos/boxlist:latest}"
    restart: unless-stopped
    environment:
      SITE_URL: "${SITE_URL:-}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-5244}:5244"
    volumes:
      - data:/opt/openlist/data
    stop_grace_period: 30s
volumes:
  data:
