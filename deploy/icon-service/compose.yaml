services:
  icons:
    build:
      context: ../../icon-service
      dockerfile: Dockerfile
    image: ${OPENLIST_ICONS_IMAGE:-openlist-icons:local}
    # Linux only: service and backend deliberately remain on host loopback.
    network_mode: host
    user: "999:989"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 30s
    environment:
      OPENLIST_ICONS_ROOT: ${OPENLIST_ICONS_ROOT:-/var/lib/openlist-icons}
      OPENLIST_ICONS_BACKEND: ${OPENLIST_ICONS_BACKEND:?Set the existing host-loopback OpenList HTTP origin}
      OPENLIST_ICONS_ORIGIN: ${OPENLIST_ICONS_ORIGIN:?Set the exact public HTTPS origin without trailing slash}
    volumes:
      - type: bind
        source: ${OPENLIST_ICONS_DATA:?Prepare a dedicated absolute data directory owned by UID 999}
        target: ${OPENLIST_ICONS_ROOT:-/var/lib/openlist-icons}
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
