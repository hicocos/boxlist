name: Validate and build
on:
  push:
    branches: [main]
    tags: ['custom-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Install pinned pnpm
        run: npm install -g pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ux
      - run: pnpm run lint
      - name: Build same-origin frontend
        run: pnpm run build
        env:
          VITE_API_URL: '/'
      - name: Package compiled frontend
        run: |
          mkdir -p artifacts
          tar -czf artifacts/boxlist.tar.gz dist/
          cd artifacts
          sha256sum boxlist.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: boxlist
          path: artifacts/
  native-backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: boxlist
          path: frontend-artifact
      - name: Install full embedded frontend
        run: |
          cd frontend-artifact
          sha256sum -c SHA256SUMS
          cd ..
          rm -rf backend/public/dist
          mkdir -p backend/public/dist
          tar -xzf frontend-artifact/boxlist.tar.gz --strip-components=1 -C backend/public/dist
      - name: Native icon and adapter tests
        working-directory: backend
        run: go test -race ./internal/iconlibrary ./server
        env:
          GOMAXPROCS: '4'
      - name: Build single-process backend
        working-directory: backend
        run: |
          mkdir -p ../artifacts
          go build -trimpath -o ../artifacts/openlist-custom .
        env:
          CGO_ENABLED: '0'
          GOMAXPROCS: '4'
