name: Native integrated build and gated release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fixed version tag, for example custom-v4.2.6.1 (must not be latest)'
        required: true
        type: string
      publish:
        description: 'Publish Release and GHCR only after licensing/security review and environment approval'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: integrated-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed tag and installer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^custom-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]
          sh -n scripts/install.sh
          sh scripts/install.sh --help
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: backend/go.sum
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: pnpm run test:ux && pnpm run lint
      - run: VITE_API_URL=/ pnpm run build
      - name: Prepare embedded frontend and native Go tests
        run: |
          rm -rf backend/public/dist
          cp -a dist backend/public/dist
          cd backend
          CGO_ENABLED=0 GOTOOLCHAIN=local go test ./internal/iconlibrary ./server
      - uses: docker/setup-buildx-action@v3
      - name: Build single-process image (no registry push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: boxlist:${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
      - name: Native runtime, real auth and persistence acceptance
        env:
          OPENLIST_INTEGRATED_TEST_IMAGE: boxlist:${{ inputs.version }}
          OPENLIST_INTEGRATED_TEST_SCRATCH: ${{ runner.temp }}
        run: |
          python3 -m venv "$RUNNER_TEMP/smoke-venv"
          "$RUNNER_TEMP/smoke-venv/bin/pip" install Pillow==11.3.0
          sudo env OPENLIST_INTEGRATED_TEST_IMAGE="$OPENLIST_INTEGRATED_TEST_IMAGE" OPENLIST_INTEGRATED_TEST_SCRATCH="$OPENLIST_INTEGRATED_TEST_SCRATCH" \
            "$RUNNER_TEMP/smoke-venv/bin/python" tests/integrated-image-smoke.py
      - name: Verify binary version; package release candidates
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --network none --read-only boxlist:"$VERSION" version
          mkdir -p artifacts
          tar -czf artifacts/boxlist-"$VERSION".tar.gz dist/
          git archive --format=tar HEAD | gzip > artifacts/boxlist-source-"$VERSION".tar.gz
          cp scripts/install.sh artifacts/install.sh
          docker save boxlist:"$VERSION" | gzip > artifacts/boxlist-image-"$VERSION"-linux-amd64.tar.gz
          cd artifacts
          sha256sum -- boxlist-"$VERSION".tar.gz boxlist-source-"$VERSION".tar.gz install.sh > SHA256SUMS
          sha256sum -- boxlist-image-"$VERSION"-linux-amd64.tar.gz > IMAGE_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-${{ inputs.version }}
          path: artifacts/
          retention-days: 7
  publish:
    needs: build
    # Disabled by default. Set this repo variable ONLY after asset/license/history review.
    if: ${{ inputs.publish && vars.INTEGRATED_RELEASE_APPROVED == 'true' }}
    environment: integrated-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: integrated-${{ inputs.version }}
          path: artifacts/
      - name: Check reviewed assets, load and publish fixed image
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^custom-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]
          cd artifacts
          sha256sum -c SHA256SUMS
          sha256sum -c IMAGE_SHA256SUMS
          gzip -dc boxlist-image-"$VERSION"-linux-amd64.tar.gz | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          IMAGE=ghcr.io/hicocos/boxlist:"$VERSION"
          docker tag boxlist:"$VERSION" "$IMAGE"
          # No latest tag; refuse replacing an existing version.
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            printf '%s\n' 'Version image already exists; refusing overwrite.' >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            printf '%s\n' 'Release already exists; refusing overwrite.' >&2
            exit 1
          fi
          docker push "$IMAGE"
          docker manifest inspect "$IMAGE"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Native integrated $VERSION" \
            --notes "Native Go integrated edition, linux/amd64 image; complete dist/ frontend and corresponding source attached. See README for AGPL/MIT terms, data permissions, HTTPS and migration safety." \
            boxlist-"$VERSION".tar.gz boxlist-source-"$VERSION".tar.gz install.sh SHA256SUMS
          gh release view "$VERSION" --json tagName,url,assets
